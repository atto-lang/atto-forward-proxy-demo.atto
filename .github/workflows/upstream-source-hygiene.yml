# Structural-only: this workflow does not run .ores guest code.
name: Upstream source hygiene (structural only)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-only:
    if: >-
      github.repository_id == '1429955596' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.id == 1429955596 &&
        github.event.pull_request.base.repo.id == 1429955596 &&
        github.event.pull_request.base.ref == 'main') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head and clean tracked files
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEMO_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_DEMO_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          printf 'EXACT_DEMO_HEAD=%s\n' "$EXPECTED_DEMO_SHA"
          printf 'EXACT_DEMO_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
      - name: Validate source-tip contract and optional immutable compiler pin
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/UPSTREAM_SOURCE_TIPS_2026-10-29.md
          if [[ -f SOURCE_REF ]]; then
            grep -Eq '^[0-9a-f]{40}$' SOURCE_REF
            test "$(wc -l < SOURCE_REF)" -eq 1
          fi
      - name: Deny Python tooling
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(git ls-files -z -- '*.py' '*.pyi' '*.ipynb')
          if (( ${#python_files[@]} )); then
            printf 'POLICY_FAILURE: Python tooling must be ported to Rust:\n' >&2
            printf '  %s\n' "${python_files[@]}" >&2
            exit 1
          fi
      - name: Explicit structural-only verdict
        shell: bash
        run: |
          set -euo pipefail
          n="$(git ls-files -- '*.ores' | wc -l | tr -d ' ')"
          printf 'STRUCTURAL_ONLY tracked_ores_sources=%s\n' "$n"
          printf 'NOT_EXECUTED: no genuine compiler or Oreslang guest was run\n'

      - name: Test adversarial source-policy regressions
        shell: bash
        run: bash ci/test-source-policy.sh
      - name: Enforce exact Git-index source policy
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_POLICY_MODE: strict
        run: bash ci/source-policy.sh
      - name: Test tracked source and pure contract inventory regressions
        shell: bash
        run: bash ci/ores-test-source-inventory.sh
      - name: Require complete Git-indexed Oreslang source and test inventories
        shell: bash
        run: bash ci/ores-verify-source-inventory.sh
