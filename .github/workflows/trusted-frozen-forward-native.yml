# Native compiler and contract gate. No runtime source checkout or cross-org mirror.
# A trusted, isolated runner carrying the 'oreslang-jdk25' label must have an
# approved Oreslang Java/Graal executable on PATH. Missing runtime is a failure.
name: Trusted Frozen Forward Native Admission
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-main-preflight:
    # Hosted-only, source-free: do not allocate a trusted self-hosted runner
    # until an independent API read verifies today's default-branch identity.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == '1429955596' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify live protected default branch and control-plane SHA
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-forward-proxy-demo.ores'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "${GH_READ_TOKEN:-}"
          command -v jq >/dev/null
          # A plan/access workaround must NEVER turn private source public.
          # Verify live repository identity and privacy independent of event
          # fields, before trusting any branch-protection response.
          repository_json="$(curl --fail --silent --show-error --retry 0 \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ores-truffle-oreslang/oreslang-forward-proxy-demo.ores')"
          jq -e \
            '(.id == 1429955596) and (.full_name == "ores-truffle-oreslang/oreslang-forward-proxy-demo.ores") and (.private == true) and (.visibility == "private") and (.default_branch == "main") and (.archived == false)' \
            <<<"$repository_json" >/dev/null || {
              echo 'unexpected repository identity, privacy or default branch' >&2
              exit 1
            }
          echo 'repository_identity_private=true'
          # Read-only GET: a stale or unprotected main must fail closed.
          branch_json="$(curl --fail --silent --show-error --retry 0 \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ores-truffle-oreslang/oreslang-forward-proxy-demo.ores/branches/main')"
          jq -e --arg sha "$GITHUB_SHA" \
            '(.protected == true) and (.commit.sha == $sha)' \
            <<<"$branch_json" >/dev/null || {
              echo 'default main protection or workflow-control SHA mismatch' >&2
              exit 1
            }
          echo 'live_main_protection=true'
          # Verify the effective active rules for main, not merely the branch's
          # coarse protected boolean. This endpoint requires Metadata: read and
          # returns active repository/organization rules that actually apply.
          rules_json="$(curl --fail --silent --show-error --retry 0 \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ores-truffle-oreslang/oreslang-forward-proxy-demo.ores/rules/branches/main?per_page=100')"
          jq -e '
            any(.[];
              .type == "pull_request" and
              (.parameters.required_approving_review_count >= 1) and
              (.parameters.dismiss_stale_reviews_on_push == true) and
              (.parameters.require_last_push_approval == true) and
              (.parameters.required_review_thread_resolution == true)
            )
          ' <<<"$rules_json" >/dev/null || {
            echo 'main lacks required independent-review/stale-review/conversation rules' >&2
            exit 1
          }
          jq -e 'any(.[]; .type == "non_fast_forward")' <<<"$rules_json" >/dev/null || {
            echo 'main does not block force pushes' >&2
            exit 1
          }
          jq -e 'any(.[]; .type == "deletion")' <<<"$rules_json" >/dev/null || {
            echo 'main does not restrict deletion' >&2
            exit 1
          }
          echo 'effective_main_review_rules=true'
          echo "control_plane_sha=$GITHUB_SHA"
  native-contracts:
    # Only admitted after the source-free hosted preflight succeeds.
    needs: protected-main-preflight
    # This workflow must be merged into protected default main and reviewed
    # independently before any trusted self-hosted runner may start.
    # No untrusted pull_request/pull_request_target source or inputs are used.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_id == '1429955596' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    # A named group prevents scheduling on the unrestricted default runner pool.
    # Admin must restrict this group to this exact reviewed workflow on main.
    runs-on:
      group: oreslang-trusted-native
      labels: [self-hosted, linux, x64, oreslang-jdk25]
    timeout-minutes: 20
    steps:
      - name: Recheck protected private main before frozen checkout
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-forward-proxy-demo.ores'
          test "$GITHUB_REPOSITORY_ID" = '1429955596'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "${GH_READ_TOKEN:-}"
          command -v jq >/dev/null
          for endpoint in repository branch; do
            case "$endpoint" in
              repository) url='https://api.github.com/repos/ores-truffle-oreslang/oreslang-forward-proxy-demo.ores' ;;
              branch) url='https://api.github.com/repos/ores-truffle-oreslang/oreslang-forward-proxy-demo.ores/branches/main' ;;
            esac
            response="$(curl --fail --silent --show-error --retry 0 \
              --connect-timeout 5 --max-time 15 \
              -H "Authorization: Bearer $GH_READ_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$url")"
            if [[ "$endpoint" == repository ]]; then
              jq -e '(.id == 1429955596) and (.private == true) and (.visibility == "private") and (.default_branch == "main") and (.archived == false)' <<<"$response" >/dev/null
            else
              jq -e --arg head "$GITHUB_SHA" '(.protected == true) and (.commit.sha == $head)' <<<"$response" >/dev/null
            fi
          done
          rules_json="$(curl --fail --silent --show-error --retry 0 \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ores-truffle-oreslang/oreslang-forward-proxy-demo.ores/rules/branches/main?per_page=100')"
          jq -e '
            any(.[];
              .type == "pull_request" and
              (.parameters.required_approving_review_count >= 1) and
              (.parameters.dismiss_stale_reviews_on_push == true) and
              (.parameters.require_last_push_approval == true) and
              (.parameters.required_review_thread_resolution == true)
            ) and
            any(.[]; .type == "non_fast_forward") and
            any(.[]; .type == "deletion")
          ' <<<"$rules_json" >/dev/null || {
            echo 'effective protected-main governance changed before native allocation' >&2
            exit 1
          }
          echo 'native_precheckout_live_admission=true'
      - name: Checkout exact frozen release candidate tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Never substitute a PR head or mutable target-branch SHA here.
          ref: fe46a4cac8c3cbedfaa5d872bc0e6348974141b5
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify exact frozen source HEAD, JDK25 and administrator-approved runtime
        shell: bash
        env:
          EXPECTED_SHA: 'fe46a4cac8c3cbedfaa5d872bc0e6348974141b5'
          WORKFLOW_CONTROL_SHA: ${{ github.sha }}
          WORKFLOW_REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_FROZEN_BASE_SHA: 'fe46a4cac8c3cbedfaa5d872bc0e6348974141b5'
          EXPECTED_FROZEN_TREE_SHA: '42052135ffd0ed6db5f4d1031fbbc2234824b81a'
          EXPECTED_REPOSITORY_ID: '1429955596'
          APPROVED_ORESLANG_RUNTIME_BUNDLE_SHA256: ${{ vars.ORESLANG_APPROVED_RUNTIME_BUNDLE_SHA256 }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'untrusted control-plane ref' >&2; exit 1; }
          test "$WORKFLOW_REF_PROTECTED" = true || { echo 'default main is not protected' >&2; exit 1; }
          test "$EXPECTED_SHA" = "$EXPECTED_FROZEN_BASE_SHA" || { echo 'checkout not pinned to frozen release SHA' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_tree" = "$EXPECTED_FROZEN_TREE_SHA" || { echo 'frozen source tree mismatch' >&2; exit 1; }
          printf 'source_head=%s\nsource_tree=%s\nworkflow_control_sha=%s\nref_protected=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$EXPECTED_SHA" "$actual_tree" "$WORKFLOW_CONTROL_SHA" "$WORKFLOW_REF_PROTECTED" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          test "${RUNNER_OS:-}" = Linux
          test "${RUNNER_ARCH:-}" = X64
          test "$(uname -m)" = x86_64
          java -version
          spec="$(java -XshowSettings:properties -version 2>&1 | sed -nE 's/^[[:space:]]*java\.specification\.version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' | head -n 1)"
          test "$spec" = 25 || { echo "JDK 25 required, found ${spec:-missing}" >&2; exit 1; }
          # Execute only an administrator-staged, exact-hash runtime bundle.
          # The bundle contract is a single top-level oreslang-runtime/ directory
          # containing bin/oreslang and every Oreslang runtime/JAR dependency.
          # Symlinks and special files are rejected after extraction.
          runtime_bundle='/opt/oreslang-approved/oreslang-runtime.tar.gz'
          # Running as root defeats root-owned staging guarantees.
          test "$(id -u)" != 0 || { echo 'native runner must not execute as root' >&2; exit 1; }
          test -f "$runtime_bundle" || { echo 'approved runtime bundle missing' >&2; exit 1; }
          # Reject writable/symlinked parent directories before hashing or
          # extracting the reviewed archive.
          for pinned_path in /opt /opt/oreslang-approved "$runtime_bundle"; do
            test ! -L "$pinned_path" || { echo 'runtime staging path is a symlink' >&2; exit 1; }
            test "$(stat -c %u -- "$pinned_path")" = 0 || {
              echo 'runtime staging path must be root-owned' >&2; exit 1;
            }
            pinned_mode="$(stat -c %a -- "$pinned_path")"
            (( (8#$pinned_mode & 022) == 0 )) || {
              echo 'runtime staging path must not be group/world writable' >&2; exit 1;
            }
          done
          [[ "${APPROVED_ORESLANG_RUNTIME_BUNDLE_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Missing/invalid administrator-approved Oreslang runtime bundle SHA-256" >&2; exit 1; }
          approved_bundle_sha="${APPROVED_ORESLANG_RUNTIME_BUNDLE_SHA256,,}"
          actual_bundle_sha="$(sha256sum -- "$runtime_bundle" | cut -d " " -f 1)"
          printf "oreslang_runtime_bundle=%s\noreslang_runtime_bundle_sha256=%s\n" "$runtime_bundle" "$actual_bundle_sha"
          test "$actual_bundle_sha" = "$approved_bundle_sha" || { echo "Unapproved Oreslang runtime bundle" >&2; exit 1; }
          echo 'oreslang_runtime_bundle_digest_verified=true'
          # Reject archive links and special files BEFORE extraction: checking
          # only after extraction cannot undo writes through archive links.
          if ! tar -tvzf "$runtime_bundle" | LC_ALL=C awk '
            substr($0,1,1) != "d" && substr($0,1,1) != "-" { exit 1 }
          '; then
            echo 'runtime archive has symlinks, hardlinks or special members' >&2
            exit 1
          fi
          tar -tzf "$runtime_bundle" > "$RUNNER_TEMP/oreslang-runtime-members.txt"
          test -s "$RUNNER_TEMP/oreslang-runtime-members.txt" || { echo "empty Oreslang runtime bundle" >&2; exit 1; }
          while IFS= read -r member; do
            case "$member" in
              oreslang-runtime|oreslang-runtime/*) ;;
              *) echo "unexpected runtime archive path: $member" >&2; exit 1 ;;
            esac
            case "/$member/" in
              */../*|*/./*) echo "unsafe runtime archive path: $member" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/oreslang-runtime-members.txt"
          runtime_root="$RUNNER_TEMP/oreslang-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$runtime_root"
          mkdir -m 700 -- "$runtime_root"
          tar -xzf "$runtime_bundle" --strip-components=1 --no-same-owner --no-same-permissions -C "$runtime_root"
          test -z "$(find "$runtime_root" -xdev -type l -print -quit)" || { echo "runtime bundle must not contain symlinks" >&2; exit 1; }
          test -z "$(find "$runtime_root" -xdev ! -type d ! -type f -print -quit)" || { echo "runtime bundle contains special files" >&2; exit 1; }
          launcher="$runtime_root/bin/oreslang"
          test -f "$launcher" && test -x "$launcher" || { echo "approved runtime missing executable bin/oreslang" >&2; exit 1; }
          runtime_manifest="$RUNNER_TEMP/oreslang-runtime-manifest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sha256"
          (
            cd "$runtime_root"
            find . -xdev -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$runtime_manifest"
          test -s "$runtime_manifest"
          runtime_manifest_sha="$(sha256sum -- "$runtime_manifest" | cut -d " " -f 1)"
          printf "oreslang_runtime_manifest_sha256=%s\n" "$runtime_manifest_sha"
          chmod -R a-w -- "$runtime_root"
          # A private per-run wrapper re-verifies the approved archive and the
          # complete extracted runtime manifest on every Oreslang invocation.
          test -n "${RUNNER_TEMP:-}" && test -n "${GITHUB_RUN_ID:-}" && test -n "${GITHUB_RUN_ATTEMPT:-}" && test -n "${GITHUB_ENV:-}"
          umask 077
          wrapper_dir="$RUNNER_TEMP/oreslang-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -- "$wrapper_dir"
          wrapper="$wrapper_dir/oreslang"
          printf '%s\n' '#!/bin/bash' 'set -euo pipefail' > "$wrapper"
          printf "runtime_bundle=%q\n" "$runtime_bundle" >> "$wrapper"
          printf "expected_bundle_sha=%q\n" "$approved_bundle_sha" >> "$wrapper"
          printf "runtime_root=%q\n" "$runtime_root" >> "$wrapper"
          printf "runtime_manifest=%q\n" "$runtime_manifest" >> "$wrapper"
          printf "expected_manifest_sha=%q\n" "$runtime_manifest_sha" >> "$wrapper"
          printf "launcher=%q\n" "$launcher" >> "$wrapper"
          printf '%s\n' \
            'test -f "$runtime_bundle" || exit 1' \
            'actual_bundle_sha="$(/usr/bin/sha256sum -- "$runtime_bundle" | /usr/bin/cut -d " " -f 1)"' \
            'test "$actual_bundle_sha" = "$expected_bundle_sha" || { echo "approved Oreslang runtime bundle changed" >&2; exit 1; }' \
            'test -z "$(/usr/bin/find "$runtime_root" -xdev ! -type d ! -type f -print -quit)" || exit 1' \
            'actual_manifest_sha="$(cd "$runtime_root" && /usr/bin/find . -xdev -type f -print0 | LC_ALL=C /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/sha256sum | /usr/bin/sha256sum | /usr/bin/cut -d " " -f 1)"' \
            'test "$actual_manifest_sha" = "$expected_manifest_sha" || { echo "approved Oreslang runtime file set changed" >&2; exit 1; }' \
            'test -x "$launcher" || exit 1' \
            'exec "$launcher" "$@"' >> "$wrapper"
          chmod 700 "$wrapper"
          timeout 15s "$wrapper" --version || timeout 15s "$wrapper" --build-info || timeout 15s "$wrapper" --help
          printf "ORESLANG_VERIFIED_WRAPPER=%s\n" "$wrapper" >> "$GITHUB_ENV"
          echo 'oreslang_complete_runtime_manifest_verified=true'
      - name: Compile complete frozen Oreslang source inventory
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$ORESLANG_VERIFIED_WRAPPER"
          test -x "$wrapper"
          test "$(git rev-parse 'HEAD^{tree}')" = '42052135ffd0ed6db5f4d1031fbbc2234824b81a'
          test -z "$(find src tests bench -type l -name '*.ores' -print -quit)"
          find src tests bench -type f -name '*.ores' -print | LC_ALL=C sort > "$RUNNER_TEMP/oreslang-files.txt"
          source_count="$(wc -l < "$RUNNER_TEMP/oreslang-files.txt" | tr -d '[:space:]')"
          test "$source_count" = 31 || { echo "expected 31 reviewed Oreslang files, found $source_count" >&2; exit 1; }
          sha256sum "$RUNNER_TEMP/oreslang-files.txt"
          while IFS= read -r file; do
            test -n "$file" || continue
            "$wrapper" --check "$file"
          done < "$RUNNER_TEMP/oreslang-files.txt"

      - name: Execute every standalone contract in frozen tree
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$ORESLANG_VERIFIED_WRAPPER"
          find tests -maxdepth 1 -type f -name '*_contract.ores' -print | LC_ALL=C sort > "$RUNNER_TEMP/pure-contracts.txt"
          contract_count="$(wc -l < "$RUNNER_TEMP/pure-contracts.txt" | tr -d '[:space:]')"
          test "$contract_count" = 15 || { echo "expected 15 standalone contracts, found $contract_count" >&2; exit 1; }
          sha256sum "$RUNNER_TEMP/pure-contracts.txt"
          while IFS= read -r file; do
            test -n "$file" || continue
            "$wrapper" "$file"
          done < "$RUNNER_TEMP/pure-contracts.txt"

      - name: Compiler-check entrypoint
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check src/main.ores'
      - name: Compiler-check configuration path admission
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check src/config_path.ores'
      - name: Compiler-check YAML parser
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check src/proxy_yaml.ores'
      - name: Compiler-check routing policy
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check src/route_policy.ores'
      - name: Compiler-check middleware policy
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check src/middleware_policy.ores'
      - name: Compiler-check generation coordinator
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check src/generation.ores'
      - name: Compiler-check native YAML contract
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check tests/yaml_policy_contract.ores'
      - name: Compiler-check native generation contract
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check tests/generation_contract.ores'
      - name: Compiler-check native middleware contract
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check tests/middleware_generation_contract.ores'
      - name: Compiler-check canonical path contract
        run: '"$ORESLANG_VERIFIED_WRAPPER" --check tests/path_admission_contract.ores'
      - name: Execute canonical configuration path contract
        run: '"$ORESLANG_VERIFIED_WRAPPER" tests/path_admission_contract.ores'
      - name: Execute YAML / routing / policy contract
        run: '"$ORESLANG_VERIFIED_WRAPPER" tests/yaml_policy_contract.ores'
      - name: Execute generation epoch / rollback contract
        run: '"$ORESLANG_VERIFIED_WRAPPER" tests/generation_contract.ores'
      - name: Execute independent middleware snapshot contract
        run: '"$ORESLANG_VERIFIED_WRAPPER" tests/middleware_generation_contract.ores'

      - name: Compiler-check HTTP metadata admission and header filtering
        run: |
          "$ORESLANG_VERIFIED_WRAPPER" --check src/proxy_wire.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check src/header_policy.ores
      - name: Compiler-check symbolic service and CONNECT actor gate
        run: |
          "$ORESLANG_VERIFIED_WRAPPER" --check src/service_bindings.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check src/connect_admission.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/service_bindings_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/connect_admission_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check bench/connect_policy_workload.ores
      - name: Execute symbolic service and CONNECT actor-gate contracts
        run: |
          "$ORESLANG_VERIFIED_WRAPPER" tests/service_bindings_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" tests/connect_admission_contract.ores
      - name: Compiler-check native slot lifecycle, middleware manifest and data layouts
        run: |
          "$ORESLANG_VERIFIED_WRAPPER" --check src/slot_lifecycle.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check src/slot_pool.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check src/middleware_manifest.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check src/data_layout.ores
      - name: Compiler-check all security and slot regression vectors
        run: |
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/security_admission_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/wire_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/header_policy_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/middleware_manifest_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/data_layout_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/slot_lifecycle_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/slot_pool_contract.ores
      - name: Execute complete Oreslang safety contracts
        run: |
          "$ORESLANG_VERIFIED_WRAPPER" tests/security_admission_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" tests/wire_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" tests/header_policy_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" tests/middleware_manifest_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" tests/data_layout_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" tests/slot_lifecycle_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" tests/slot_pool_contract.ores

      - name: Compiler-check lexical admission regression
        run: |
          "$ORESLANG_VERIFIED_WRAPPER" --check src/admission_text.ores
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/lexical_admission_contract.ores
      - name: Execute lexical admission regression
        run: '"$ORESLANG_VERIFIED_WRAPPER" tests/lexical_admission_contract.ores'

      - name: Compiler-check and execute native policy performance workload
        run: |
          "$ORESLANG_VERIFIED_WRAPPER" --check tests/perf_policy_contract.ores
          "$ORESLANG_VERIFIED_WRAPPER" tests/perf_policy_contract.ores
