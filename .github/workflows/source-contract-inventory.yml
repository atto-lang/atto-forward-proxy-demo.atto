name: Forward proxy source contracts
on:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  inventory:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.id == 1429955596 &&
       github.event.pull_request.base.repo.id == 1429955596)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out source head
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEMO_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_DEMO_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          printf 'EXACT_DEMO_HEAD=%s\n' "$EXPECTED_DEMO_SHA"
          printf 'EXACT_DEMO_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
      - name: Reject resurrection of legacy PR-head native workflow
        shell: bash
        run: |
          set -euo pipefail
          # No self-hosted runner or guest invoked. Same admission function is applied
          # to current HEAD and isolated clean/mutated Git fixtures.
          legacy='.github/workflows/native-contracts.yml'
          expected_blob='8665fd3435a94826daff836df1a98c17db773335'
          verify_retired() {
            local root="$1" file="$legacy" mode actual committed
            test -f "$root/$file" && test ! -L "$root/$file" || return 1
            mode="$(/usr/bin/git -C "$root" ls-files --stage -- "$file")" || return 1
            [[ "$mode" == '100644 '* ]] || return 1
            actual="$(/usr/bin/git -C "$root" hash-object --no-filters -- "$file")" || return 1
            committed="$(/usr/bin/git -C "$root" rev-parse "HEAD:$file")" || return 1
            [[ "$actual" == "$expected_blob" && "$committed" == "$expected_blob" ]]
          }
          verify_retired "$GITHUB_WORKSPACE" || {
            echo 'SECURITY_FAILURE: legacy native workflow missing, linked, or resurrected' >&2
            exit 1
          }
          echo "LEGACY_NATIVE_WORKFLOW_RETIRED reviewed_blob=$expected_blob"
          # Real adversarial fixture: a committed broad self-hosted workflow must be
          # refused, as must uncommitted replacement, symlink, and missing file.
          test -d "$RUNNER_TEMP"
          fixture="$(/usr/bin/mktemp -d -- "$RUNNER_TEMP/legacy-native-negative.XXXXXX")"
          trap '/usr/bin/rm -rf -- "$fixture"' EXIT
          /usr/bin/git -C "$fixture" init -q
          /usr/bin/mkdir -p -- "$fixture/.github/workflows"
          /usr/bin/cp -- "$GITHUB_WORKSPACE/$legacy" "$fixture/$legacy"
          /usr/bin/git -C "$fixture" add -- "$legacy"
          /usr/bin/git -C "$fixture" -c user.name='Security fixture' -c user.email='fixture@example.invalid' commit -qm 'approved disabled legacy stub'
          verify_retired "$fixture" || {
            echo 'TEST_FAILURE: approved legacy stub was rejected' >&2
            exit 1
          }
          /usr/bin/printf '%s\n' 'name: Unreviewed native workflow' 'on:' '  workflow_dispatch:' 'jobs:' '  native:' '    runs-on: [self-hosted, linux, x64, oreslang-jdk25]' > "$fixture/$legacy"
          if verify_retired "$fixture"; then
            echo 'TEST_FAILURE: uncommitted broad self-hosted workflow admitted' >&2
            exit 1
          fi
          /usr/bin/git -C "$fixture" add -- "$legacy"
          /usr/bin/git -C "$fixture" -c user.name='Security fixture' -c user.email='fixture@example.invalid' commit -qm 'simulate unsafe release merge'
          if verify_retired "$fixture"; then
            echo 'TEST_FAILURE: committed broad self-hosted workflow admitted' >&2
            exit 1
          fi
          /usr/bin/rm -- "$fixture/$legacy"
          /usr/bin/ln -s /dev/null "$fixture/$legacy"
          if verify_retired "$fixture"; then
            echo 'TEST_FAILURE: symlinked native workflow admitted' >&2
            exit 1
          fi
          /usr/bin/rm -- "$fixture/$legacy"
          if verify_retired "$fixture"; then
            echo 'TEST_FAILURE: missing native workflow admitted' >&2
            exit 1
          fi
          echo 'LEGACY_NATIVE_RETIREMENT_NEGATIVE_FIXTURES_PASS scenarios=4; native_guest=NOT_EXECUTED'
      - name: Reject absent, empty, untracked or symlinked contract inputs
        shell: bash
        run: |
          set -euo pipefail
          for file in src/main.ores src/proxy_wire.ores src/header_policy.ores src/slot_pool.ores tests/wire_contract.ores tests/header_policy_contract.ores tests/slot_pool_contract.ores config/example.yaml .cli-flags.toml; do
            test -f "$file"
            test -s "$file"
            test ! -L "$file"
            git ls-files --error-unmatch -- "$file" >/dev/null
            [[ "$(git ls-files --stage -- "$file")" == "100644 "* ]]
            cmp -s "$file" <(git show "HEAD:$file")
          done
          test -z "$(find src tests config -type l -print -quit)"
          echo 'TRACKED_SOURCE_CONTRACT_INVENTORY_PASS required_files=9'
      - name: Verify trusted native verifier source hardening
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/trusted-native-verifier.sh
          grep -Fq 'guest_tmp="$(/usr/bin/mktemp -d -- "$runner_temp_root/oreslang-guest.XXXXXX")"' ci/trusted-native-verifier.sh
          grep -Fq '"TMPDIR=$guest_tmp"' ci/trusted-native-verifier.sh
          grep -Fq 'runner_temp_root="$(/usr/bin/realpath -e -- "$RUNNER_TEMP")"' ci/trusted-native-verifier.sh
          grep -Fq 'runner temp root must be owned by the runner account' ci/trusted-native-verifier.sh
          grep -Fq 'runner temp root must not be group/world writable' ci/trusted-native-verifier.sh
          grep -Fq 'runner temp root must be outside the frozen checkout' ci/trusted-native-verifier.sh
          grep -Fq 'trap cleanup_guest_tmp EXIT' ci/trusted-native-verifier.sh
          grep -Fq '/usr/bin/rm -rf -- "$guest_tmp"' ci/trusted-native-verifier.sh
          verifier_blob="$(git hash-object --no-filters -- ci/trusted-native-verifier.sh)"
          grep -Fq "test \"\$verifier_blob\" = '$verifier_blob'" .github/workflows/trusted-frozen-forward-native.yml
          echo "TRUSTED_NATIVE_VERIFIER_SOURCE_HARDENING_PASS private_tmp=1 cleanup=1 temp_root=validated verifier_blob=$verifier_blob"
      - name: Execute fail-closed source-policy adversarial fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/source-policy.sh
          bash -n ci/test-source-policy.sh
          bash ci/test-source-policy.sh
      - name: Audit exact PR-head source with hardened policy
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_POLICY_MODE: strict
        run: |
          set -euo pipefail
          bash ci/source-policy.sh
      - name: Validate shared native evidence format (source-free negative fixtures only)
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/native-release-evidence-v1.sh
          bash -n ci/test-native-release-evidence-v1.sh
          bash ci/test-native-release-evidence-v1.sh
      - name: Clearly separate source inventory from runtime verdict
        shell: bash
        run: echo 'SOURCE_INVENTORY_ONLY; native compile/execute and network tests NOT_EXECUTED.'
