name: Forward proxy safe defaults
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute source-free canonical-default regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/verify-safe-defaults.sh
          bash ci/verify-safe-defaults.sh --self-test
      - name: Enforce exact pinned-forward defaults
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash ci/verify-safe-defaults.sh --verify
